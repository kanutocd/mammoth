name: Release Helm Chart

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm chart to GHCR
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check tag matches chart version
        shell: bash
        run: |
          chart_version="$(helm show chart charts/mammoth | awk '$1 == "version:" { print $2 }')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$chart_version"

      - name: Lint and package chart
        run: |
          helm lint charts/mammoth
          helm package charts/mammoth --destination dist

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish chart
        run: helm push "dist/mammoth-${GITHUB_REF_NAME#v}.tgz" oci://ghcr.io/kanutocd/charts
